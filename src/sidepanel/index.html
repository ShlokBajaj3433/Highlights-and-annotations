<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: white; border-bottom: 1px solid #eaeaea; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .page-title { font-weight: 600; font-size: 14px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .presence-badge { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #f0f4ff; border-radius: 20px; font-size: 12px; color: #667eea; }
    .presence-avatars { display: flex; gap: -6px; }
    .presence-avatar { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 600; }
    .presence-avatar:not(:first-child) { margin-left: -6px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #666; }
    .icon-btn:hover { background: #f0f0f0; color: #1a1a2e; }
    .tabs { display: flex; background: white; border-bottom: 1px solid #eaeaea; flex-shrink: 0; }
    .tab { flex: 1; padding: 10px 16px; border: none; background: transparent; font-size: 13px; font-weight: 500; color: #666; cursor: pointer; position: relative; }
    .tab.active { color: #667eea; }
    .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #667eea; border-radius: 1px; }
    .tab:hover:not(.active) { color: #1a1a2e; background: #fafafa; }
    .tab-badge { background: #667eea; color: white; font-size: 10px; padding: 1px 5px; border-radius: 10px; margin-left: 6px; }
    .content { flex: 1; overflow-y: auto; padding: 16px; }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .highlight-item { background: white; border: 1px solid #eaeaea; border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
    .highlight-item.orphaned { border-style: dashed; opacity: 0.8; }
    .highlight-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .highlight-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 600; }
    .highlight-user { font-size: 12px; font-weight: 500; }
    .highlight-time { font-size: 11px; color: #999; margin-left: auto; }
    .highlight-quote { font-size: 13px; line-height: 1.5; color: #1a1a2e; padding-left: 32px; border-left: 2px solid #eee; margin-left: 16px; }
    .highlight-comments { margin-top: 8px; padding-left: 32px; border-left: 2px solid #eee; margin-left: 16px; }
    .comment { display: flex; gap: 8px; padding: 8px 0; }
    .comment-avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 9px; font-weight: 600; flex-shrink: 0; }
    .comment-content { flex: 1; font-size: 12px; }
    .comment-author { font-weight: 500; margin-right: 6px; }
    .comment-time { font-size: 10px; color: #999; margin-left: 8px; }
    .comment-reply { margin-left: 28px; border-left: 1px solid #eee; padding-left: 8px; }
    .add-comment { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
    .add-comment-input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 12px; outline: none; }
    .add-comment-input:focus { border-color: #667eea; }
    .add-comment-btn { padding: 6px 16px; background: #667eea; color: white; border: none; border-radius: 20px; font-size: 11px; font-weight: 500; cursor: pointer; }
    .empty-state { text-align: center; padding: 40px 20px; color: #999; }
    .empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state-title { font-size: 14px; font-weight: 500; color: #666; margin-bottom: 4px; }
    .empty-state-desc { font-size: 12px; }
    .feed-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .feed-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .feed-content { flex: 1; min-width: 0; }
    .feed-title { font-size: 13px; font-weight: 500; color: #1a1a2e; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-meta { display: flex; gap: 8px; font-size: 11px; color: #999; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 16px; outline: none; }
    .search-input:focus { border-color: #667eea; }
    .search-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-chip { padding: 6px 12px; background: white; border: 1px solid #ddd; border-radius: 20px; font-size: 11px; cursor: pointer; }
    .filter-chip.active { background: #667eea; color: white; border-color: #667eea; }
    .search-results { display: flex; flex-direction: column; gap: 8px; }
    .search-result { padding: 12px; background: white; border: 1px solid #eaeaea; border-radius: 8px; cursor: pointer; }
    .search-result:hover { border-color: #667eea; }
    .result-header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .result-type { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .result-type.highlight { background: #f3e8ff; color: #764ba2; }
    .result-type.visit { background: #e0e7ff; color: #667eea; }
    .result-type.comment { background: #fef3c7; color: #d97706; }
    .result-type.note { background: #d1fae5; color: #059669; }
    .result-title { font-size: 13px; font-weight: 500; color: #1a1a2e; }
    .result-snippet { font-size: 12px; color: #666; margin-top: 4px; }
    .result-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #999; }
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #999; }
    .spinner { width: 20px; height: 20px; border: 2px solid #eee; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#667eea;">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M15 3v18"/>
      </svg>
      <span class="page-title" id="pageTitle">Loading...</span>
    </div>
    <div class="header-actions">
      <div class="presence-badge" id="presenceBadge" style="display:none;">
        <div class="presence-avatars" id="sidePresenceAvatars"></div>
        <span id="sidePresenceCount">0</span> on this page
      </div>
      <button class="icon-btn" id="notificationsBtn" title="Notifications">🔔</button>
      <button class="icon-btn" id="searchBtn" title="Search">🔍</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>
  
  <nav class="tabs">
    <button class="tab active" data-tab="highlights">Highlights</button>
    <button class="tab" data-tab="chat">Chat</button>
    <button class="tab" data-tab="feed">Feed</button>
    <button class="tab" data-tab="search">Search</button>
  </nav>
  
  <main class="content">
    <section class="panel active" id="highlightsPanel">
      <div id="highlightsList"></div>
    </section>
    
    <section class="panel" id="chatPanel">
      <div id="chatMessages"></div>
      <div style="position:sticky;bottom:0;background:#fafafa;padding:12px 16px;border-top:1px solid #eaeaea;">
        <div class="add-comment" style="margin:0;">
          <input type="text" class="add-comment-input" id="chatInput" placeholder="Message this page...">
          <button class="add-comment-btn" id="chatSendBtn">Send</button>
        </div>
      </div>
    </section>
    
    <section class="panel" id="feedPanel">
      <div id="feedList"></div>
    </section>
    
    <section class="panel" id="searchPanel">
      <input type="text" class="search-input" id="searchInput" placeholder="Search highlights, comments, notes, visits...">
      <div class="search-filters" id="searchFilters"></div>
      <div class="search-results" id="searchResults"></div>
    </section>
  </main>

  <script type="module" src="./index.ts"></script>
</body>
</html>
