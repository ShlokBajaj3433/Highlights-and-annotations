<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 360px; background: #fff; color: #1a1a2e; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #eaeaea; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; color: #1a1a2e; }
    .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; }
    .workspace-selector { flex: 1; margin-left: 12px; }
    .workspace-selector select { width: 100%; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; }
    .settings-btn { background: none; border: none; padding: 6px; cursor: pointer; border-radius: 6px; color: #666; }
    .settings-btn:hover { background: #f5f5f5; color: #1a1a2e; }
    .status { padding: 12px 16px; border-bottom: 1px solid #eaeaea; display: flex; align-items: center; gap: 12px; }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .status-dot.active { background: #22c55e; }
    .status-dot.paused { background: #f59e0b; }
    .pause-btn { margin-left: auto; padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 12px; cursor: pointer; }
    .pause-btn:hover { background: #f5f5f5; }
    .presence { padding: 12px 16px; border-bottom: 1px solid #eaeaea; }
    .presence-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #666; }
    .avatars { display: flex; gap: -8px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; }
    .avatar:not(:first-child) { margin-left: -8px; }
    .avatar.more { background: #667eea; }
    .feed { padding: 12px 16px; max-height: 280px; overflow-y: auto; }
    .feed-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .feed-item:last-child { border-bottom: none; }
    .feed-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .feed-content { flex: 1; min-width: 0; }
    .feed-title { font-size: 13px; font-weight: 500; color: #1a1a2e; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-meta { display: flex; gap: 8px; font-size: 11px; color: #999; }
    .feed-type { display: inline-flex; align-items: center; gap: 4px; }
    .feed-type.highlight { color: #764ba2; }
    .feed-type.visit { color: #667eea; }
    .actions { display: flex; padding: 12px 16px; gap: 8px; border-top: 1px solid #eaeaea; }
    .action-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .action-btn.primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
    .action-btn:hover:not(.primary) { background: #f5f5f5; }
    .action-btn.primary:hover { opacity: 0.9; }
    .empty-state { text-align: center; padding: 24px; color: #999; font-size: 13px; }
    .empty-state-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">C</div>
      Copage
    </div>
    <div class="workspace-selector">
      <select id="workspaceSelect"></select>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
  </div>
  
  <div class="status">
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
    <button class="pause-btn" id="pauseBtn">Pause</button>
  </div>
  
  <div class="presence">
    <div class="presence-header">
      <span>On this page</span>
      <span id="presenceCount">0</span>
    </div>
    <div class="avatars" id="presenceAvatars"></div>
  </div>
  
  <div class="feed" id="feed">
    <div class="empty-state">
      <div class="empty-state-icon">📄</div>
      No team activity yet
    </div>
  </div>
  
  <div class="actions">
    <button class="action-btn primary" id="openSidePanelBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M15 3v18"/>
      </svg>
      Open Side Panel
    </button>
    <button class="action-btn" id="viewFeedBtn">Full Feed</button>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
